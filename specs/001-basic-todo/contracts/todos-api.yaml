openapi: 3.0.3
info:
  title: Todo Application API
  description: RESTful API for managing tasks in the Todo application.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
    description: Local Spring Boot Backend Server
paths:
  /todos:
    get:
      summary: List all todos
      description: Retrieve a list of todos, optionally filtered by completion status.
      parameters:
        - name: completed
          in: query
          required: false
          schema:
            type: boolean
          description: Filter tasks by completion status (true/false). If omitted, returns all tasks.
      responses:
        '200':
          description: List of todos returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TodoResponse'
    post:
      summary: Create a new todo
      description: Add a new task to the todo list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTodoRequest'
      responses:
        '201':
          description: Todo created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoResponse'
        '400':
          description: Invalid input (e.g. blank title or missing payload).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /todos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Get a todo by ID
      responses:
        '200':
          description: Todo retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoResponse'
        '404':
          description: Todo not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update a todo
      description: Update the title and/or completed status of an existing task.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTodoRequest'
      responses:
        '200':
          description: Todo updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoResponse'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Todo not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete a todo
      description: Permanently remove a task by ID.
      responses:
        '204':
          description: Todo deleted successfully.
        '404':
          description: Todo not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /todos/{id}/toggle:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    patch:
      summary: Toggle todo completion
      description: Inverts the completion status of a todo task.
      responses:
        '200':
          description: Todo status toggled successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoResponse'
        '404':
          description: Todo not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /todos/completed:
    delete:
      summary: Clear all completed todos
      description: Permanently deletes all tasks that have completed = true.
      responses:
        '204':
          description: All completed todos deleted successfully.

components:
  schemas:
    CreateTodoRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          example: "Buy groceries"
    UpdateTodoRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          example: "Buy organic groceries"
        completed:
          type: boolean
          example: true
    TodoResponse:
      type: object
      required:
        - id
        - title
        - completed
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: "Buy groceries"
        completed:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
          example: "2026-08-29T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-08-29T10:05:00Z"
    ErrorResponse:
      type: object
      required:
        - message
        - status
      properties:
        message:
          type: string
          example: "Validation failed: title cannot be blank"
        status:
          type: integer
          example: 400
        timestamp:
          type: string
          format: date-time
